name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://clinic_test:clinic_test@localhost:5432/clinic_test
      BETTER_AUTH_SECRET: ci-only-synthetic-secret-never-use-in-production
      CLINIC_TIMEZONE: Africa/Casablanca
      ALLOW_TEST_DATABASE_RESET: true
      ALLOW_DEMO_SEED: false
      ALLOW_DEMO_RESET: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Secret scan
        run: pnpm security:scan

      - name: Validate migration history
        run: pnpm db:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test PostgreSQL integration
        run: pnpm test:integration

      - name: Build
        run: pnpm build
