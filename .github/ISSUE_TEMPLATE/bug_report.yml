name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real patient information, clinical data, credentials, tokens, cookies, production database content, or other sensitive information.**

        Use synthetic, redacted examples only. Do not report security vulnerabilities here; use [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible sequence using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0-beta.2 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Node.js, pnpm, and PostgreSQL versions as relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Synthetic/redacted logs only. Remove tokens, cookies, credentials, patient data, and clinical data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Optional screenshots
      description: Synthetic or fully redacted screenshots only.
    validations:
      required: false
